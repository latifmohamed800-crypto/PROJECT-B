name: Original Source APK - Offline Audiobook
on:
  push:
    branches: [PROJECT-B]
    paths: ['.github/workflows/original-source-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch preserved offline Android source
        run: git clone --depth 1 --branch mainLAtifword https://github.com/LAtifword/LAtifword-Audiobook.git /tmp/audiobook
      - name: Build preserved offline Android application
        run: gradle -p /tmp/audiobook/android_offline --no-daemon --stacktrace :app:assembleDebug
      - name: Verify and package
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=/tmp/audiobook/android_offline/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" dist/LATIF-OFFLINE-AUDIOBOOK-RECOVERED-SOURCE.apk
          unzip -t dist/*.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/LATIF-OFFLINE-AUDIOBOOK-RECOVERED-SOURCE.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LATIF-OFFLINE-AUDIOBOOK-RECOVERED-SOURCE-APK
          path: dist/
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "source-offline-audiobook-${{ github.run_number }}" dist/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "LATIF Offline Audiobook · Preserved Source APK" --notes "Built from the preserved original offline Android source in LAtifword/LAtifword-Audiobook."
