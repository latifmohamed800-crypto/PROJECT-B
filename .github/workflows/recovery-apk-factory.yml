name: Recovery APK Factory

on:
  push:
    branches:
      - recovery/android
    paths:
      - 'recovery-manifest.json'
      - 'tools/generate_android_apps.py'
      - '.github/workflows/recovery-apk-factory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android projects
        run: python3 tools/generate_android_apps.py

      - name: Build every APK
        run: gradle -p generated-android --no-daemon --stacktrace clean assembleDebug

      - name: Collect and verify APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import json, pathlib, shutil, re
          manifest=json.load(open('recovery-manifest.json',encoding='utf-8'))
          for app in manifest['apps']:
              module=re.sub(r'[^a-zA-Z0-9_]', '_', app['slug']).lower()
              files=list((pathlib.Path('generated-android')/module/'build/outputs/apk/debug').glob('*.apk'))
              if not files:
                  raise SystemExit(f'No APK produced for {module}')
              target=pathlib.Path('dist')/(app['slug'].upper()+'-debug.apk')
              shutil.copy2(files[0],target)
              print(target)
          PY
          for apk in dist/*.apk; do
            unzip -t "$apk" >/dev/null
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          done
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload APK artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: latif-recovery-apks-${{ github.run_number }}
          path: dist/
          if-no-files-found: error

      - name: Publish installable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="recovery-${{ github.run_number }}"
          gh release create "$TAG" dist/*             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --title "LATIF Recovery APKs #${{ github.run_number }}"             --notes "Automated Android recovery build from recovery/android. APK SHA-256 hashes are included in SHA256SUMS.txt."             --latest
