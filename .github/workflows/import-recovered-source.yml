name: Import Recovered Upstream Source

on:
  push:
    branches: [recovery/android]
    paths: ['.github/workflows/import-recovered-source.yml']

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import LATIF AI OS baseline
        run: |
          set -euo pipefail
          rm -rf /tmp/latif-brain projects/latif-ai-os-audiobook
          git clone --depth 1 --branch latif-brain https://github.com/LAtifword/latif-brain.git /tmp/latif-brain
          rm -rf /tmp/latif-brain/.git
          mkdir -p projects/latif-ai-os-audiobook
          cp -a /tmp/latif-brain/. projects/latif-ai-os-audiobook/
      - name: Commit baseline source
        run: |
          git config user.name "LATIF Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add projects/latif-ai-os-audiobook
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "recovery: import LATIF AI OS baseline source"
          git push origin HEAD:recovery/android
